# Local environment: no TLS, no NFS, no swarm secrets
name: app

services:
  web:
    image: nginx:1.28-alpine
    configs:
      - source: web_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - core
      - static

  core:
    build: ./core
    image: app-core:dev
    environment:
      DB_PASSWORD: app
      FEED_TOKEN: dev-token
      MAIL_FROM: app@localhost
      REPORT_TO: admin@localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  static:
    build: ./static
    image: app-static:dev

  db:
    build: ./db
    image: app-db:dev
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", ""]

  # Catches the emails instead of relaying them (web UI on :8025)
  smtp:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:2525
    ports:
      - "8025:8025"

  backup:
    build: ./backup
    image: app-backup:dev
    environment:
      PGHOST: db
      PGUSER: app
      PGDATABASE: app
      PGPASSWORD: app
      BACKUP_SCHEDULE: "0 * * * *"
      BACKUP_ON_START: "1"
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  auto:
    build: ./auto
    image: app-auto:dev
    environment:
      CORE_URL: http://core:8000
      FEED_TOKEN: dev-token
      FEED_INTERVAL: "60"
      FEED_URLS: http://static/static/demo/product-1.html,http://static/static/demo/product-2.html
    depends_on:
      - core

volumes:
  db-data:
  backups:

configs:
  web_conf:
    content: |
      server {
          listen 80;
          # Resolve on each request: core and static change IP when recreated
          resolver 127.0.0.11 valid=10s;
          location = /metrics { return 404; }
          location /static/ {
              set $$static http://static:80;
              proxy_pass $$static;
          }
          location / {
              set $$core http://core:8000;
              proxy_pass $$core;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          }
      }
