services:
  nginx:
    image: ccds-project.duckdns.org/nginx-proxy:1.4
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - /opt/certbot/www:/var/www/certbot:ro
      - /opt/certbot/conf:/etc/letsencrypt:ro
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == swarm-manager-1
    
                   
       
  registry:
    image: registry:3.1.2
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ccds-project registry
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
      REGISTRY_LOG_LEVEL: info
    secrets:
      - registry_htpasswd
    volumes:
      - /srv/nfs/registry:/var/lib/registry
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    networks:
      proxy:
        aliases:
          - registry
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  certbot:
    image: ccds-project.duckdns.org/certbot:1.0
    volumes:
      - /opt/certbot/conf:/etc/letsencrypt
      - /opt/certbot/www:/var/www/certbot
    networks:
      - proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == swarm-manager-1

          
volumes:
  registry-data:

networks:
  proxy:
    external: true
    name: proxy

secrets:
  registry_htpasswd:
    # Swarm secrets cannot change in place: raise the version whenever the
    # password file changes, then deploy again.
    name: registry_htpasswd_v1
    file: ./secrets/registry_htpasswd



    
