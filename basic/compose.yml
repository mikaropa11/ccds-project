services:
  nginx:
    image: nginx:1.31
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - registry
    networks:
      - proxy
      - local_proxy
    restart: unless-stopped

  registry:
    image: registry:3.1.2
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "ccds-project local registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
      REGISTRY_LOG_LEVEL: info
    secrets:
      - registry_htpasswd
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: proxy
  local_proxy:
    external: true
    name: local_proxy

volumes:
  registry-data:

secrets:
  registry_htpasswd:
    file: ./secrets/registry_htpasswd
