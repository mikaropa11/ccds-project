server {
	listen 80 default_server;
	server_name ccds-project.duckdns.org;
	
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

	# Everything else moves to HTTPS. The registry is only served there,
	# so registry passwords never travel unencrypted.
	location / {
	    return 301 https://$host$request_uri;
	}

	location /liveness {
		default_type text/plain;
		return 200 "Nginx reverse proxy running\n";
	}
}

server {
	listen 443 ssl;
    server_name ccds-project.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ccds-project.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ccds-project.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://registry:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /liveness {
        default_type text/plain;
        return 200 "Nginx reverse proxy running\n";
    }
}

# app stack. The resolver and variables let nginx start without the app stack.
server {
    listen 443 ssl;
    server_name app.ccds-project.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/ccds-project.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ccds-project.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s;

    location = /metrics {
        return 404;
    }

    location /static/ {
        set $static http://app-static:80;
        proxy_pass $static;
    }

    location / {
        set $core http://app-core:8000;
        proxy_pass $core;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
