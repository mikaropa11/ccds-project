services:
  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stats_backend
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:nightly-slim
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:8080/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    configs:
      - source: grafana_swarm_dashboard
        target: /var/lib/grafana/dashboards/local-dashboard.json
    depends_on:
      - prometheus
    networks:
      - stats_backend
      - local_proxy

  node-exporter:
    image: prom/node-exporter:master-distroless
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: cleanstart/cadvisor:0.60.6
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - stats_backend

volumes:
  prometheus_data:
  grafana_data:

configs:
  grafana_swarm_dashboard:
    file: ./grafana/dashboards/local-dashboard.json

networks:
  stats_backend:
    driver: bridge

  local_proxy:
    external: true
    name: local_proxy

