services:
  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    configs:
      - source: prometheus_production
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring_backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager-1
      restart_policy:
        condition: on-failure

  grafana:
    image: ccds-project.duckdns.org/grafana-hostoverview:1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://ccds-project.duckdns.org/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_prometheus_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_swarm_dashboard
        target: /var/lib/grafana/dashboards/swarm-observability.json
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_backend
      - proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager-1
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  cadvisor:
    image: cleanstart/cadvisor:0.60.6
    network_mode: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

configs:
  prometheus_production:
    file: ./prometheus/prometheus-production.yml

  grafana_prometheus_datasource:
    file: ./grafana/provisioning/datasources/prometheus.yml

  grafana_dashboards_provider:
    file: ./grafana/provisioning/dashboards/dashboards.yml

  grafana_swarm_dashboard:
    file: ./grafana/dashboards/swarm-observability.json

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring_backend:
    driver: overlay
    internal: true

  proxy:
    external: true
    name: proxy
