global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    dns_sd_configs:
      - names:
          - tasks.monitoring_node-exporter
        type: A
        port: 9100
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: cadvisor
    dns_sd_configs:
      - names:
          - tasks.monitoring_cadvisor
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

